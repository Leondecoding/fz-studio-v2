<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="{{ '/' | relative_url }}" aria-label="FZ Studio home">
      <img src="{{ '/assets/images/logo.jpg' | relative_url }}" alt="FZ Studio">
    </a>

    <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        {% assign item_url = item.url | relative_url %}
        <a href="{{ item_url }}">{{ item.label }}</a>
      {% endfor %}
    </nav>

    <div class="site-actions">
      <paypal-cart-button data-id="pp-view-cart-header"></paypal-cart-button>
      <script>
        cartPaypal.Cart({ id: "pp-view-cart-header" });
      </script>

      <button
        id="nav-toggle"
        class="nav-toggle"
        type="button"
        aria-label="Open menu"
        aria-controls="site-nav"
        aria-expanded="false"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

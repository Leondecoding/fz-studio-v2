---
layout: default
title: Art Prints
permalink: /art-prints/
---

<style>
  #art-prints-page{
    max-width:1540px;
    margin:0 auto;
    padding:28px 28px 40px;
  }

  /* ===== LIST ===== */
  .print-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:34px;
  }

  .print-card{
    margin:0;
    cursor:pointer;
  }

  .print-thumb{
    width:100%;
    aspect-ratio:1/1;
    border:1px solid #e7e7e7;
    border-radius:10px;
    background:#f7f7f5;
    overflow:hidden;
  }

  .print-thumb img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  .print-info{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:18px;
    margin-top:12px;
  }

  .print-title,
  .print-price{
    margin:0;
    font-size:16px;
    font-weight:400;
    line-height:1.5;
  }

  .print-title{color:#222}
  .print-price{color:#666;white-space:nowrap}

  /* ===== DETAIL ===== */
  .product-view[hidden],
  .print-grid[hidden]{
    display:none;
  }

  .product-layout{
    width:min(1020px,100%);
    min-height:calc(100vh - 185px);
    margin:0 auto;
    padding-top:58px;
    box-sizing:border-box;
    display:grid;
    grid-template-columns:minmax(0,560px) minmax(320px,390px);
    gap:70px;
    align-items:start;
  }

  /* Your finished square JPG fills this entire square.
     Nothing is added inside it by the website. */
  .product-image-slot{
    width:min(560px, calc(100vh - 255px));
    max-width:100%;
    aspect-ratio:1/1;
    justify-self:end;
    background:#e8e8e6;
    overflow:hidden;
    cursor:zoom-in;
  }

  .product-image-slot img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  .product-copy{
    width:100%;
    max-width:390px;
    padding-top:0;
  }

  .product-copy h1{
    margin:0 0 12px;
    font-size:28px;
    font-weight:400;
    line-height:1.25;
    color:#111;
  }

  .product-price{
    margin:0 0 28px;
    font-size:18px;
    font-weight:400;
    color:#555;
  }

  .size-label{
    display:block;
    margin:0 0 10px;
    font-size:14px;
    color:#666;
  }

  .size-options{
    display:flex;
    gap:10px;
    margin-bottom:24px;
  }

  .size-options button{
    min-width:62px;
    height:38px;
    padding:0 15px;
    border:1px solid #aaa;
    border-radius:999px;
    background:#fff;
    color:#222;
    font:inherit;
    font-size:14px;
    font-weight:400;
    cursor:pointer;
  }

  .size-options button.is-selected{
    border-color:#111;
    background:#111;
    color:#fff;
  }

  .buy-stack{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
    margin-bottom:26px;
  }

  .buy-placeholder{
    width:auto;
    min-width:190px;
    min-height:48px;
    padding:0 24px;
    border:1px solid #d7d7d7;
    border-radius:10px;
    background:#f2f2f2;
    color:#222;
    font:inherit;
    font-size:15px;
    font-weight:400;
    cursor:not-allowed;
  }

  .product-description{
    margin-top:26px;
    color:#555;
    font-size:15px;
    line-height:1.7;
  }

  .product-description p{
    margin:0 0 12px;
  }

  /* ===== TRUE FULL-SCREEN LIGHTBOX ===== */
  .image-lightbox[hidden]{
    display:none;
  }

  .image-lightbox{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:99999;
    background:#fff;
    overflow-y:auto;
    overflow-x:hidden;
    cursor:zoom-out;
  }

  .image-lightbox-content{
    width:100%;
    min-height:100%;
    padding:120px 20px 64px;
    box-sizing:border-box;
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }

  .image-lightbox-content img{
    width:calc(100vw - 40px);
    max-width:none;
    max-height:none;
    height:auto;
    object-fit:contain;
    display:block;
  }

  .image-lightbox-placeholder{
    width:min(88vw,760px);
    aspect-ratio:1/1;
    background:#e8e8e6;
  }

  .image-lightbox-close{
    position:fixed;
    top:18px;
    right:22px;
    z-index:100000;
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:#222;
    font:inherit;
    font-size:30px;
    font-weight:300;
    line-height:1;
    cursor:pointer;
  }

  @media(max-width:1050px){
    .product-layout{
      width:min(760px,100%);
      min-height:auto;
      padding:22px 0 36px;
      grid-template-columns:1fr;
      gap:34px;
    }

    .product-image-slot{
      width:min(560px,80vw);
      justify-self:center;
    }

    .product-copy{
      max-width:560px;
      margin:0 auto;
    }
  }

  @media(max-width:960px){
    #art-prints-page{padding:24px 22px 48px}

    .print-grid{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:30px;
    }
  }

  @media(max-width:620px){
    #art-prints-page{padding:20px 18px 42px}

    .print-grid{
      grid-template-columns:1fr;
      gap:34px;
    }

    .product-image-slot{
      width:100%;
    }

    .product-copy h1{
      font-size:24px;
    }

    .image-lightbox-content{
      padding:92px 10px 42px;
    }

    .image-lightbox-content img{
      width:calc(100vw - 20px);
    }
  }
</style>

<main id="art-prints-page">

  <section id="print-grid" class="print-grid" aria-label="Art prints"></section>

  <section id="product-view" class="product-view" hidden>
    <div class="product-layout">

      <div id="product-image-slot"
           class="product-image-slot"
           role="button"
           tabindex="0"
           aria-label="Open full-screen image"></div>

      <div class="product-copy">
        <h1 id="product-title"></h1>
        <p id="product-price" class="product-price"></p>

        <span class="size-label">Size</span>
        <div id="size-options" class="size-options"></div>

        <div class="buy-stack">
          <!-- Replace these two placeholders with the real PayPal buttons later. -->
          <button class="buy-placeholder" type="button" disabled>Pay via PayPal</button>
          <button class="buy-placeholder" type="button" disabled>Add to Bag</button>
        </div>

        <div id="product-description" class="product-description"></div>
      </div>

    </div>
  </section>

  <div id="image-lightbox" class="image-lightbox" hidden>
    <button id="image-lightbox-close"
            class="image-lightbox-close"
            type="button"
            aria-label="Close image">×</button>
    <div id="image-lightbox-content" class="image-lightbox-content"></div>
  </div>

</main>

<script>
  /* To add your JPG later, only fill in image: "...".
     Example:
     image: "{{ '/assets/images/butterfly-1.jpg' | relative_url }}"
  */
  const prints = [
    {
      id: "butterfly-1",
      title: "Butterfly-1",
      price: "£25",
      image: "",
      sizes: ["A5", "A4"],
      description: "Fine art print from an original FZ Studio watercolour."
    },
    {
      id: "butterfly-2",
      title: "Butterfly-2",
      price: "£25",
      image: "",
      sizes: ["A5", "A4"],
      description: "Fine art print from an original FZ Studio watercolour."
    },
    {
      id: "dawn-1",
      title: "Dawn 1",
      price: "£25",
      image: "",
      sizes: ["A5", "A4"],
      description: "Fine art print from an original FZ Studio watercolour."
    }
  ];

  const grid = document.getElementById("print-grid");
  const productView = document.getElementById("product-view");
  const productImageSlot = document.getElementById("product-image-slot");
  const productTitle = document.getElementById("product-title");
  const productPrice = document.getElementById("product-price");
  const sizeOptions = document.getElementById("size-options");
  const productDescription = document.getElementById("product-description");

  const lightbox = document.getElementById("image-lightbox");
  const lightboxContent = document.getElementById("image-lightbox-content");
  const lightboxClose = document.getElementById("image-lightbox-close");

  function imageMarkup(item){
    return item.image
      ? `<img src="${item.image}" alt="${item.title}">`
      : "";
  }

  function renderGrid(){
    grid.innerHTML = prints.map(item => `
      <figure class="print-card" data-product="${item.id}" tabindex="0">
        <div class="print-thumb">${imageMarkup(item)}</div>
        <figcaption class="print-info">
          <p class="print-title">${item.title}</p>
          <p class="print-price">${item.price}</p>
        </figcaption>
      </figure>
    `).join("");
  }

  function openProduct(id, updateHash = true){
    const item = prints.find(print => print.id === id);
    if(!item) return;

    productImageSlot.innerHTML = imageMarkup(item);
    productTitle.textContent = item.title;
    productPrice.textContent = item.price;
    productDescription.innerHTML = `<p>${item.description}</p>`;

    sizeOptions.innerHTML = item.sizes.map((size, index) => `
      <button type="button"
              class="${index === 0 ? "is-selected" : ""}"
              data-size="${size}">
        ${size}
      </button>
    `).join("");

    grid.hidden = true;
    productView.hidden = false;
    window.scrollTo(0, 0);

    if(updateHash){
      history.pushState({product:id}, "", `#${id}`);
    }
  }

  function showGrid(updateHash = true){
    productView.hidden = true;
    grid.hidden = false;
    closeLargeImage();

    if(updateHash){
      history.pushState({}, "", window.location.pathname);
    }
  }

  /* IMPORTANT:
     Lightbox reads the image that is ACTUALLY displayed in the left square.
     It no longer depends on a separate JS image value.
     So if you later replace the left square with your JPG, clicking it works.
  */
  function openLargeImage(){
    const displayedImage = productImageSlot.querySelector("img");

    lightboxContent.innerHTML = "";

    if(displayedImage){
      const largeImage = document.createElement("img");
      largeImage.src = displayedImage.currentSrc || displayedImage.src;
      largeImage.alt = displayedImage.alt || "";
      lightboxContent.appendChild(largeImage);
    }else{
      const placeholder = document.createElement("div");
      placeholder.className = "image-lightbox-placeholder";
      lightboxContent.appendChild(placeholder);
    }

    lightbox.hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeLargeImage(){
    lightbox.hidden = true;
    lightboxContent.innerHTML = "";
    document.body.style.overflow = "";
  }

  grid.addEventListener("click", event => {
    const card = event.target.closest(".print-card");
    if(card) openProduct(card.dataset.product);
  });

  grid.addEventListener("keydown", event => {
    if(event.key !== "Enter" && event.key !== " ") return;

    const card = event.target.closest(".print-card");
    if(card){
      event.preventDefault();
      openProduct(card.dataset.product);
    }
  });

  productImageSlot.addEventListener("click", openLargeImage);

  productImageSlot.addEventListener("keydown", event => {
    if(event.key === "Enter" || event.key === " "){
      event.preventDefault();
      openLargeImage();
    }
  });

  sizeOptions.addEventListener("click", event => {
    const button = event.target.closest("button[data-size]");
    if(!button) return;

    sizeOptions.querySelectorAll("button")
      .forEach(item => item.classList.remove("is-selected"));

    button.classList.add("is-selected");
  });

  lightboxClose.addEventListener("click", event => {
    event.stopPropagation();
    closeLargeImage();
  });

  lightbox.addEventListener("click", closeLargeImage);

  document.addEventListener("keydown", event => {
    if(event.key === "Escape" && !lightbox.hidden){
      closeLargeImage();
    }
  });

  window.addEventListener("popstate", () => {
    const id = window.location.hash.slice(1);

    if(prints.some(item => item.id === id)){
      openProduct(id, false);
    }else{
      showGrid(false);
    }
  });

  renderGrid();

  const initialId = window.location.hash.slice(1);
  if(prints.some(item => item.id === initialId)){
    openProduct(initialId, false);
  }
</script>

---
layout: default
title: Art Prints
permalink: /art-prints/
---

<style>
  #art-prints-page{
    max-width:1540px;
    margin:0 auto;
    padding:34px 28px 72px;
  }

  .print-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:34px;
  }

  .print-card{
    margin:0;
    cursor:pointer;
  }

  .print-frame{
    width:100%;
    aspect-ratio:1/1;
    border:1px solid #e7e7e7;
    border-radius:10px;
    background:#fff;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .print-frame img,
  .product-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  .print-placeholder,
  .product-placeholder{
    width:100%;
    height:100%;
    background:#f7f7f5;
  }

  .print-info{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:20px;
    margin-top:12px;
  }

  .print-title,
  .print-price{
    margin:0;
    font-size:16px;
    font-weight:400;
    line-height:1.5;
  }

  .print-title{color:#222}
  .print-price{color:#666;white-space:nowrap}

  .product-view[hidden],
  .print-grid[hidden]{
    display:none;
  }

  .product-back{
    border:0;
    background:transparent;
    padding:0;
    margin:0 0 26px;
    font:inherit;
    font-size:14px;
    color:#666;
    cursor:pointer;
  }

  .product-layout{
    display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);
    gap:72px;
    align-items:start;
  }

  .product-image{
    width:100%;
    aspect-ratio:4/3;
    border:1px solid #e7e7e7;
    border-radius:10px;
    background:#fff;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .product-copy{
    padding-top:4px;
  }

  .product-copy h1{
    margin:0 0 12px;
    font-size:28px;
    font-weight:400;
    line-height:1.25;
    color:#111;
  }

  .product-price{
    margin:0 0 30px;
    font-size:18px;
    color:#555;
  }

  .size-label{
    display:block;
    margin-bottom:10px;
    font-size:14px;
    color:#666;
  }

  .size-options{
    display:flex;
    gap:10px;
    margin-bottom:28px;
  }

  .size-options button{
    min-width:62px;
    height:38px;
    padding:0 15px;
    border:1px solid #aaa;
    border-radius:999px;
    background:#fff;
    color:#222;
    font:inherit;
    font-size:14px;
    cursor:pointer;
  }

  .size-options button.is-selected{
    border-color:#111;
    background:#111;
    color:#fff;
  }

  .paypal-area{
    margin-bottom:26px;
  }

  .paypal-placeholder{
    width:100%;
    min-height:48px;
    border:1px solid #111;
    border-radius:8px;
    background:#111;
    color:#fff;
    font:inherit;
    opacity:.55;
    cursor:not-allowed;
  }

  .paypal-note{
    margin:10px 0 0;
    font-size:12px;
    color:#888;
  }

  .product-description{
    margin-top:30px;
    padding-top:24px;
    border-top:1px solid #eee;
    font-size:15px;
    line-height:1.75;
    color:#555;
  }

  .product-description p{
    margin:0 0 12px;
  }

  @media(max-width:960px){
    #art-prints-page{padding:28px 22px 64px}
    .print-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px}
    .product-layout{grid-template-columns:1fr;gap:36px}
  }

  @media(max-width:620px){
    #art-prints-page{padding:22px 18px 52px}
    .print-grid{grid-template-columns:1fr;gap:34px}
    .product-copy h1{font-size:24px}
  }
</style>

<main id="art-prints-page">

  <section id="print-grid" class="print-grid" aria-label="Art prints"></section>

  <section id="product-view" class="product-view" hidden>
    <button id="product-back" class="product-back" type="button">← Back to Art Prints</button>

    <div class="product-layout">
      <div id="product-image" class="product-image"></div>

      <div class="product-copy">
        <h1 id="product-title"></h1>
        <p id="product-price" class="product-price"></p>

        <span class="size-label">Size</span>
        <div id="size-options" class="size-options"></div>

        <div class="paypal-area">
          <button class="paypal-placeholder" type="button" disabled>Add to Bag — PayPal connection pending</button>
          <p class="paypal-note">The final Add to Bag button will use PayPal Shopping Cart.</p>
        </div>

        <div id="product-description" class="product-description"></div>
      </div>
    </div>
  </section>

</main>

<script>
  const prints = [
    {
      id: "art-print-1",
      title: "Art Print I",
      price: "£—",
      image: "",
      sizes: ["A5", "A4"],
      description: "Fine art print from an original FZ Studio watercolour."
    },
    {
      id: "art-print-2",
      title: "Art Print II",
      price: "£—",
      image: "",
      sizes: ["A5", "A4"],
      description: "Fine art print from an original FZ Studio watercolour."
    },
    {
      id: "art-print-3",
      title: "Art Print III",
      price: "£—",
      image: "",
      sizes: ["A5", "A4"],
      description: "Fine art print from an original FZ Studio watercolour."
    }
  ];

  const grid = document.getElementById("print-grid");
  const productView = document.getElementById("product-view");
  const productImage = document.getElementById("product-image");
  const productTitle = document.getElementById("product-title");
  const productPrice = document.getElementById("product-price");
  const sizeOptions = document.getElementById("size-options");
  const productDescription = document.getElementById("product-description");
  const backButton = document.getElementById("product-back");

  function imageMarkup(item, className){
    return item.image
      ? `<img src="${item.image}" alt="${item.title}">`
      : `<div class="${className}"></div>`;
  }

  function renderGrid(){
    grid.innerHTML = prints.map(item => `
      <figure class="print-card" data-product="${item.id}" tabindex="0">
        <div class="print-frame">
          ${imageMarkup(item, "print-placeholder")}
        </div>
        <figcaption class="print-info">
          <p class="print-title">${item.title}</p>
          <p class="print-price">${item.price}</p>
        </figcaption>
      </figure>
    `).join("");
  }

  function openProduct(id, updateHash = true){
    const item = prints.find(print => print.id === id);
    if(!item) return;

    productImage.innerHTML = imageMarkup(item, "product-placeholder");
    productTitle.textContent = item.title;
    productPrice.textContent = item.price;

    sizeOptions.innerHTML = item.sizes.map((size, index) => `
      <button type="button" class="${index === 0 ? "is-selected" : ""}" data-size="${size}">
        ${size}
      </button>
    `).join("");

    productDescription.innerHTML = `<p>${item.description}</p>`;

    grid.hidden = true;
    productView.hidden = false;
    window.scrollTo(0, 0);

    if(updateHash) history.pushState({product:id}, "", `#${id}`);
  }

  function showGrid(updateHash = true){
    productView.hidden = true;
    grid.hidden = false;
    if(updateHash) history.pushState({}, "", window.location.pathname);
  }

  grid.addEventListener("click", event => {
    const card = event.target.closest(".print-card");
    if(card) openProduct(card.dataset.product);
  });

  grid.addEventListener("keydown", event => {
    if(event.key !== "Enter" && event.key !== " ") return;
    const card = event.target.closest(".print-card");
    if(card){
      event.preventDefault();
      openProduct(card.dataset.product);
    }
  });

  sizeOptions.addEventListener("click", event => {
    const button = event.target.closest("button[data-size]");
    if(!button) return;
    sizeOptions.querySelectorAll("button").forEach(item => item.classList.remove("is-selected"));
    button.classList.add("is-selected");
  });

  backButton.addEventListener("click", () => showGrid());

  window.addEventListener("popstate", () => {
    const id = window.location.hash.slice(1);
    if(prints.some(item => item.id === id)) openProduct(id, false);
    else showGrid(false);
  });

  renderGrid();

  const initialId = window.location.hash.slice(1);
  if(prints.some(item => item.id === initialId)) openProduct(initialId, false);
</script>

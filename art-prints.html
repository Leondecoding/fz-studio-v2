---
layout: default
title: Art Prints
permalink: /art-prints/
---

<style>
  #art-prints-page{
    max-width:1540px;
    margin:0 auto;
    padding:34px 28px 80px;
  }

  /* ===== ART PRINTS LIST ===== */
  .print-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:34px;
  }

  .print-card{
    margin:0;
    cursor:pointer;
  }

  .print-thumb{
    width:100%;
    aspect-ratio:1/1;
    border:1px solid #e7e7e7;
    border-radius:10px;
    background:#f7f7f5;
    overflow:hidden;
  }

  .print-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .print-info{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:18px;
    margin-top:12px;
  }

  .print-title,
  .print-price{
    margin:0;
    font-size:16px;
    font-weight:400;
    line-height:1.5;
  }

  .print-title{color:#222}
  .print-price{color:#666;white-space:nowrap}

  /* ===== PRODUCT DETAIL ===== */
  .product-view[hidden],
  .print-grid[hidden]{
    display:none;
  }

  .product-back{
    border:0;
    background:transparent;
    padding:0;
    margin:0 0 28px;
    font:inherit;
    font-size:14px;
    color:#666;
    cursor:pointer;
  }

  .product-layout{
    max-width:1210px;
    margin:36px auto 0;
    display:grid;
    grid-template-columns:minmax(0,655px) minmax(320px,400px);
    gap:110px;
    align-items:start;
  }

  /* This is the ONLY left-side frame.
     Your square JPG will fill this whole area. */
  .product-image-slot{
    width:100%;
    aspect-ratio:1/1;
    background:#e8e8e6;
    overflow:hidden;
    cursor:zoom-in;
  }

  .product-image-slot img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .product-copy{
    padding-top:4px;
  }

  .product-copy h1{
    margin:0 0 12px;
    font-size:28px;
    font-weight:400;
    line-height:1.25;
    color:#111;
  }

  .product-price{
    margin:0 0 30px;
    font-size:18px;
    font-weight:400;
    color:#555;
  }

  .size-label{
    display:block;
    margin:0 0 10px;
    font-size:14px;
    color:#666;
  }

  .size-options{
    display:flex;
    gap:10px;
    margin-bottom:28px;
  }

  .size-options button{
    min-width:62px;
    height:38px;
    padding:0 15px;
    border:1px solid #aaa;
    border-radius:999px;
    background:#fff;
    color:#222;
    font:inherit;
    font-size:14px;
    font-weight:400;
    cursor:pointer;
  }

  .size-options button.is-selected{
    border-color:#111;
    background:#111;
    color:#fff;
  }

  .paypal-area{
    margin:0 0 26px;
  }

  .paypal-placeholder{
    width:100%;
    min-height:48px;
    border:1px solid #111;
    border-radius:8px;
    background:#111;
    color:#fff;
    font:inherit;
    font-weight:400;
    cursor:not-allowed;
    opacity:.55;
  }

  .paypal-note{
    margin:10px 0 0;
    font-size:12px;
    line-height:1.5;
    color:#888;
  }

  .product-description{
    margin-top:30px;
    padding-top:24px;
    border-top:1px solid #eee;
    color:#555;
    font-size:15px;
    line-height:1.75;
  }

  .product-description p{
    margin:0 0 12px;
  }

  /* ===== FULL-PAGE IMAGE VIEW ===== */
  .image-lightbox[hidden]{
    display:none;
  }

  .image-lightbox{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px;
  }

  .image-lightbox img{
    max-width:94vw;
    max-height:92vh;
    width:auto;
    height:auto;
    display:block;
    object-fit:contain;
  }

  .image-lightbox-close{
    position:fixed;
    top:18px;
    right:22px;
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:#222;
    font:inherit;
    font-size:30px;
    font-weight:300;
    line-height:1;
    cursor:pointer;
  }

  @media(max-width:1100px){
    .product-layout{
      max-width:760px;
      grid-template-columns:1fr;
      gap:36px;
    }

    .product-copy{
      width:100%;
      max-width:655px;
      margin:0 auto;
    }
  }

  @media(max-width:960px){
    #art-prints-page{padding:28px 22px 64px}

    .print-grid{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:30px;
    }
  }

  @media(max-width:620px){
    #art-prints-page{padding:22px 18px 52px}

    .print-grid{
      grid-template-columns:1fr;
      gap:34px;
    }

    .product-layout{
      margin-top:18px;
    }

    .product-copy h1{
      font-size:24px;
    }

    .image-lightbox{
      padding:18px;
    }
  }
</style>

<main id="art-prints-page">

  <section id="print-grid" class="print-grid" aria-label="Art prints"></section>

  <section id="product-view" class="product-view" hidden>
    <button id="product-back" class="product-back" type="button">← Back to Art Prints</button>

    <div class="product-layout">
      <div id="product-image-slot" class="product-image-slot"
           role="button" tabindex="0" aria-label="Open large image"></div>

      <div class="product-copy">
        <h1 id="product-title"></h1>
        <p id="product-price" class="product-price"></p>

        <span class="size-label">Size</span>
        <div id="size-options" class="size-options"></div>

        <div class="paypal-area">
          <!-- Replace this with the real PayPal Shopping Cart button later. -->
          <button class="paypal-placeholder" type="button" disabled>Add to Bag — PayPal connection pending</button>
          <p class="paypal-note">PayPal Shopping Cart will be connected here.</p>
        </div>

        <div id="product-description" class="product-description"></div>
      </div>
    </div>
  </section>

  <div id="image-lightbox" class="image-lightbox" hidden>
    <button id="image-lightbox-close" class="image-lightbox-close"
            type="button" aria-label="Close image">×</button>
    <img id="image-lightbox-img" src="" alt="">
  </div>

</main>

<script>
  const prints = [
    {
      id: "butterfly-1",
      title: "Butterfly-1",
      price: "£25",
      image: "",
      sizes: ["A5", "A4"],
      description: "Fine art print from an original FZ Studio watercolour."
    },
    {
      id: "butterfly-2",
      title: "Butterfly-2",
      price: "£25",
      image: "",
      sizes: ["A5", "A4"],
      description: "Fine art print from an original FZ Studio watercolour."
    },
    {
      id: "dawn-1",
      title: "Dawn 1",
      price: "£25",
      image: "",
      sizes: ["A5", "A4"],
      description: "Fine art print from an original FZ Studio watercolour."
    }
  ];

  const grid = document.getElementById("print-grid");
  const productView = document.getElementById("product-view");
  const productImageSlot = document.getElementById("product-image-slot");
  const productTitle = document.getElementById("product-title");
  const productPrice = document.getElementById("product-price");
  const sizeOptions = document.getElementById("size-options");
  const productDescription = document.getElementById("product-description");
  const backButton = document.getElementById("product-back");

  const lightbox = document.getElementById("image-lightbox");
  const lightboxImg = document.getElementById("image-lightbox-img");
  const lightboxClose = document.getElementById("image-lightbox-close");

  let currentProduct = null;

  function imageMarkup(item){
    return item.image
      ? `<img src="${item.image}" alt="${item.title}">`
      : "";
  }

  function renderGrid(){
    grid.innerHTML = prints.map(item => `
      <figure class="print-card" data-product="${item.id}" tabindex="0">
        <div class="print-thumb">${imageMarkup(item)}</div>
        <figcaption class="print-info">
          <p class="print-title">${item.title}</p>
          <p class="print-price">${item.price}</p>
        </figcaption>
      </figure>
    `).join("");
  }

  function openProduct(id, updateHash = true){
    const item = prints.find(print => print.id === id);
    if(!item) return;

    currentProduct = item;
    productImageSlot.innerHTML = imageMarkup(item);
    productTitle.textContent = item.title;
    productPrice.textContent = item.price;
    productDescription.innerHTML = `<p>${item.description}</p>`;

    sizeOptions.innerHTML = item.sizes.map((size, index) => `
      <button type="button"
              class="${index === 0 ? "is-selected" : ""}"
              data-size="${size}">
        ${size}
      </button>
    `).join("");

    grid.hidden = true;
    productView.hidden = false;
    window.scrollTo(0, 0);

    if(updateHash){
      history.pushState({product:id}, "", `#${id}`);
    }
  }

  function showGrid(updateHash = true){
    currentProduct = null;
    productView.hidden = true;
    grid.hidden = false;
    closeLargeImage();

    if(updateHash){
      history.pushState({}, "", window.location.pathname);
    }
  }

  function openLargeImage(){
    if(!currentProduct || !currentProduct.image) return;

    lightboxImg.src = currentProduct.image;
    lightboxImg.alt = currentProduct.title;
    lightbox.hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeLargeImage(){
    lightbox.hidden = true;
    lightboxImg.src = "";
    lightboxImg.alt = "";
    document.body.style.overflow = "";
  }

  grid.addEventListener("click", event => {
    const card = event.target.closest(".print-card");
    if(card) openProduct(card.dataset.product);
  });

  grid.addEventListener("keydown", event => {
    if(event.key !== "Enter" && event.key !== " ") return;

    const card = event.target.closest(".print-card");
    if(card){
      event.preventDefault();
      openProduct(card.dataset.product);
    }
  });

  productImageSlot.addEventListener("click", openLargeImage);

  productImageSlot.addEventListener("keydown", event => {
    if(event.key === "Enter" || event.key === " "){
      event.preventDefault();
      openLargeImage();
    }
  });

  sizeOptions.addEventListener("click", event => {
    const button = event.target.closest("button[data-size]");
    if(!button) return;

    sizeOptions.querySelectorAll("button")
      .forEach(item => item.classList.remove("is-selected"));

    button.classList.add("is-selected");
  });

  backButton.addEventListener("click", () => showGrid());
  lightboxClose.addEventListener("click", closeLargeImage);

  lightbox.addEventListener("click", event => {
    if(event.target === lightbox) closeLargeImage();
  });

  document.addEventListener("keydown", event => {
    if(event.key === "Escape" && !lightbox.hidden){
      closeLargeImage();
    }
  });

  window.addEventListener("popstate", () => {
    const id = window.location.hash.slice(1);

    if(prints.some(item => item.id === id)){
      openProduct(id, false);
    }else{
      showGrid(false);
    }
  });

  renderGrid();

  const initialId = window.location.hash.slice(1);
  if(prints.some(item => item.id === initialId)){
    openProduct(initialId, false);
  }
</script>

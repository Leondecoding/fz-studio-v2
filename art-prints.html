---
layout: default
title: Art Prints
permalink: /art-prints/
---

<style>
  #art-prints-page{
    max-width:1540px;
    margin:0 auto;
    padding:34px 28px 80px;
  }

  /* ===== LIST VIEW ===== */
  .print-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:34px;
  }

  .print-card{
    margin:0;
    cursor:pointer;
  }

  .print-thumb{
    width:100%;
    aspect-ratio:1/1;
    border:1px solid #e8e8e8;
    border-radius:10px;
    background:#fff;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .print-thumb img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  .placeholder-thumb{
    width:100%;
    height:100%;
    background:#f7f7f5;
  }

  .print-meta{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin-top:12px;
  }

  .print-meta p{
    margin:0;
    font-size:16px;
    line-height:1.5;
    font-weight:400;
  }

  .print-meta .title{ color:#222; }
  .print-meta .price{ color:#666; white-space:nowrap; }

  /* ===== DETAIL VIEW ===== */
  .product-view[hidden],
  .print-grid[hidden]{
    display:none;
  }

  .product-back{
    border:0;
    background:transparent;
    padding:0;
    margin:0 0 28px;
    font:inherit;
    font-size:14px;
    color:#666;
    cursor:pointer;
  }

  .product-layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 420px;
    gap:72px;
    align-items:center;
    max-width:1320px;
    margin:0 auto;
    min-height:72vh;
  }

  .product-art-stage{
    width:min(100%, 760px);
    aspect-ratio:1/1;
    margin:0 auto;
    background:#e9e9e7;
    border-radius:4px;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .product-art-stage::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(115deg,
        rgba(255,255,255,0) 18%,
        rgba(255,255,255,0.42) 29%,
        rgba(255,255,255,0.10) 36%,
        rgba(255,255,255,0) 44%
      );
    background-size:100% 100%;
    pointer-events:none;
  }

  .product-frame{
    width:66%;
    aspect-ratio:1/1;
    background:#fff;
    box-shadow:0 16px 24px rgba(0,0,0,.16);
    padding:4.8%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:1;
  }

  .product-frame::before{
    content:"";
    position:absolute;
    inset:-14px;
    border:12px solid #5b361e;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.1),
      0 4px 8px rgba(0,0,0,.12);
    pointer-events:none;
  }

  .product-frame img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    cursor:zoom-in;
    background:#fff;
  }

  .product-frame-placeholder{
    width:100%;
    height:100%;
    background:#fafafa;
  }

  .product-copy{
    max-width:420px;
  }

  .product-copy h1{
    margin:0 0 12px;
    font-size:30px;
    line-height:1.2;
    font-weight:600;
    color:#1d1d1d;
  }

  .product-price{
    margin:0 0 6px;
    font-size:18px;
    color:#333;
  }

  .tax-note{
    margin:0 0 22px;
    font-size:15px;
    color:#666;
  }

  .size-label{
    display:block;
    margin-bottom:10px;
    font-size:14px;
    color:#666;
  }

  .size-options{
    display:flex;
    gap:10px;
    margin-bottom:24px;
  }

  .size-options button{
    min-width:62px;
    height:38px;
    padding:0 16px;
    border:1px solid #a9a9a9;
    border-radius:999px;
    background:#fff;
    color:#222;
    font:inherit;
    font-size:14px;
    cursor:pointer;
  }

  .size-options button.is-selected{
    background:#111;
    border-color:#111;
    color:#fff;
  }

  .paypal-stack{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:26px;
  }

  .paypal-button{
    width:100%;
    min-height:54px;
    border:1px solid #d7d7d7;
    border-radius:14px;
    background:#f2f2f2;
    color:#111;
    font:inherit;
    font-size:16px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:not-allowed;
  }

  .product-description{
    font-size:15px;
    line-height:1.7;
    color:#4f4f4f;
  }

  .product-description p{
    margin:0 0 12px;
  }

  /* ===== LIGHTBOX ===== */
  .lightbox[hidden]{
    display:none;
  }

  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
  }

  .lightbox-inner{
    max-width:min(92vw, 1100px);
    max-height:90vh;
    position:relative;
  }

  .lightbox img{
    max-width:100%;
    max-height:90vh;
    display:block;
    background:#fff;
  }

  .lightbox-close{
    position:absolute;
    top:-8px;
    right:-8px;
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#111;
    font-size:22px;
    cursor:pointer;
  }

  @media(max-width:1100px){
    .product-layout{
      grid-template-columns:1fr;
      gap:34px;
      min-height:auto;
    }

    .product-copy{
      max-width:760px;
      margin:0 auto;
      width:100%;
    }
  }

  @media(max-width:760px){
    #art-prints-page{
      padding:24px 18px 64px;
    }

    .print-grid{
      grid-template-columns:1fr;
      gap:30px;
    }

    .product-art-stage{
      width:100%;
    }

    .product-frame{
      width:72%;
    }

    .product-copy h1{
      font-size:26px;
    }
  }
</style>

<main id="art-prints-page">

  <section id="print-grid" class="print-grid" aria-label="Art prints"></section>

  <section id="product-view" class="product-view" hidden>
    <button id="product-back" class="product-back" type="button">← Back to Art Prints</button>

    <div class="product-layout">
      <div class="product-art-stage">
        <div class="product-frame" id="product-frame"></div>
      </div>

      <div class="product-copy">
        <h1 id="product-title"></h1>
        <p id="product-price" class="product-price"></p>
        <p class="tax-note">Taxes included.</p>

        <span class="size-label">Size</span>
        <div id="size-options" class="size-options"></div>

        <div class="paypal-stack">
          <button class="paypal-button" type="button" disabled>Pay via PayPal</button>
          <button class="paypal-button" type="button" disabled>Add to Bag</button>
        </div>

        <div id="product-description" class="product-description"></div>
      </div>
    </div>
  </section>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lightbox-inner">
      <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Close">×</button>
      <img id="lightbox-image" src="" alt="">
    </div>
  </div>

</main>

<script>
  const prints = [
    {
      id: "butterfly-1",
      title: "Butterfly-1.jpg",
      price: "£25",
      image: "",
      sizes: ["A5", "A4"],
      description: [
        "Fine art print on archival paper (Hahnemühle German Etching, 310gsm). Signed in the corner."
      ]
    },
    {
      id: "butterfly-2",
      title: "Butterfly-2.jpg",
      price: "£25",
      image: "",
      sizes: ["A5", "A4"],
      description: [
        "Fine art print on archival paper (Hahnemühle German Etching, 310gsm). Signed in the corner."
      ]
    },
    {
      id: "dawn-1",
      title: "Dawn 1.jpg",
      price: "£25",
      image: "",
      sizes: ["A5", "A4"],
      description: [
        "Fine art print on archival paper (Hahnemühle German Etching, 310gsm). Signed in the corner."
      ]
    }
  ];

  const grid = document.getElementById("print-grid");
  const productView = document.getElementById("product-view");
  const productFrame = document.getElementById("product-frame");
  const productTitle = document.getElementById("product-title");
  const productPrice = document.getElementById("product-price");
  const productDescription = document.getElementById("product-description");
  const sizeOptions = document.getElementById("size-options");
  const backButton = document.getElementById("product-back");

  const lightbox = document.getElementById("lightbox");
  const lightboxImage = document.getElementById("lightbox-image");
  const lightboxClose = document.getElementById("lightbox-close");

  function imageMarkup(item, placeholderClass){
    return item.image
      ? `<img src="${item.image}" alt="${item.title}">`
      : `<div class="${placeholderClass}"></div>`;
  }

  function renderGrid(){
    grid.innerHTML = prints.map(item => `
      <figure class="print-card" data-product="${item.id}" tabindex="0">
        <div class="print-thumb">
          ${imageMarkup(item, "placeholder-thumb")}
        </div>
        <figcaption class="print-meta">
          <p class="title">${item.title}</p>
          <p class="price">${item.price}</p>
        </figcaption>
      </figure>
    `).join("");
  }

  function renderDescription(item){
    return item.description.map(text => `<p>${text}</p>`).join("");
  }

  function openProduct(id, updateHash = true){
    const item = prints.find(print => print.id === id);
    if(!item) return;

    productFrame.innerHTML = item.image
      ? `<img src="${item.image}" alt="${item.title}" data-lightbox-src="${item.image}">`
      : `<div class="product-frame-placeholder"></div>`;

    productTitle.textContent = item.title;
    productPrice.textContent = item.price;
    productDescription.innerHTML = renderDescription(item);

    sizeOptions.innerHTML = item.sizes.map((size, index) => `
      <button type="button" class="${index === 0 ? 'is-selected' : ''}" data-size="${size}">
        ${size}
      </button>
    `).join("");

    grid.hidden = true;
    productView.hidden = false;
    window.scrollTo(0, 0);

    if(updateHash){
      history.pushState({product:id}, "", `#${id}`);
    }
  }

  function showGrid(updateHash = true){
    productView.hidden = true;
    grid.hidden = false;
    closeLightbox();

    if(updateHash){
      history.pushState({}, "", window.location.pathname);
    }
  }

  function openLightbox(src, alt){
    if(!src) return;
    lightboxImage.src = src;
    lightboxImage.alt = alt || "";
    lightbox.hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeLightbox(){
    lightbox.hidden = true;
    lightboxImage.src = "";
    lightboxImage.alt = "";
    document.body.style.overflow = "";
  }

  grid.addEventListener("click", (event) => {
    const card = event.target.closest(".print-card");
    if(card) openProduct(card.dataset.product);
  });

  grid.addEventListener("keydown", (event) => {
    if(event.key !== "Enter" && event.key !== " ") return;
    const card = event.target.closest(".print-card");
    if(card){
      event.preventDefault();
      openProduct(card.dataset.product);
    }
  });

  productFrame.addEventListener("click", (event) => {
    const image = event.target.closest("img[data-lightbox-src]");
    if(image){
      openLightbox(image.dataset.lightboxSrc, image.alt);
    }
  });

  sizeOptions.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-size]");
    if(!button) return;
    sizeOptions.querySelectorAll("button").forEach(btn => btn.classList.remove("is-selected"));
    button.classList.add("is-selected");
  });

  backButton.addEventListener("click", () => showGrid());
  lightboxClose.addEventListener("click", closeLightbox);

  lightbox.addEventListener("click", (event) => {
    if(event.target === lightbox) closeLightbox();
  });

  window.addEventListener("keydown", (event) => {
    if(event.key === "Escape") closeLightbox();
  });

  window.addEventListener("popstate", () => {
    const id = window.location.hash.slice(1);
    if(prints.some(item => item.id === id)){
      openProduct(id, false);
    } else {
      showGrid(false);
    }
  });

  renderGrid();

  const initialId = window.location.hash.slice(1);
  if(prints.some(item => item.id === initialId)){
    openProduct(initialId, false);
  }
</script>

---
layout: default
title: Art Prints
seo_title: Watercolour Art Prints | FZ Studio
description: Fine art giclée prints from original FZ Studio watercolours. 10 × 12 in on 315gsm cold press watercolour paper, with UK delivery included.
permalink: /art-prints/
---

<style>
  #art-prints-page{
    max-width:1540px;
    margin:0 auto;
    padding:28px 28px 40px;
  }

  /* ===== LIST ===== */
  .print-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:34px;
  }

  .print-card{
    margin:0;
    cursor:pointer;
  }

  .print-thumb{
    width:100%;
    aspect-ratio:1/1;
    border:1px solid #e7e7e7;
    border-radius:10px;
    background:#f7f7f5;
    overflow:hidden;
  }

  .print-thumb img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  .print-info{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:18px;
    margin-top:12px;
  }

  .print-title,
  .print-price{
    margin:0;
    font-size:16px;
    font-weight:400;
    line-height:1.5;
  }

  .print-title{color:#222}
  .print-price{color:#666;white-space:nowrap}

  /* ===== DETAIL ===== */
  .product-view[hidden],
  .print-grid[hidden]{
    display:none;
  }

  .product-layout{
    width:min(1090px,100%);
    min-height:calc(100vh - 185px);
    margin:0 auto;
    padding-top:18px;
    box-sizing:border-box;
    display:grid;
    grid-template-columns:minmax(0,600px) minmax(320px,390px);
    gap:100px;
    align-items:start;
  }

  /* Your finished square JPG fills this entire square.
     Nothing is added inside it by the website. */
  .product-image-slot{
    width:min(600px, calc(100vh - 215px));
    max-width:100%;
    aspect-ratio:1/1;
    justify-self:end;
    background:#e8e8e6;
    overflow:hidden;
    cursor:zoom-in;
  }

  .product-image-slot img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  .product-copy{
    width:100%;
    max-width:390px;
    padding-top:0;
  }

  @media(min-width:1051px){
    .product-copy{
      transform:translateY(-24px);
    }
  }

  .paypal-product{
    width:100%;
    margin:0;
  }

  .paypal-product paypal-add-to-cart-button{
    display:block;
    width:100%;
  }

  .product-facts{
    margin:24px 0 0;
    padding:22px 0;
    border-top:1px solid #e9e9e9;
    border-bottom:1px solid #e9e9e9;
    color:#666;
    font-size:14px;
    line-height:1.65;
  }

  .product-facts p{
    margin:0 0 5px;
  }

  .product-facts p:last-child{
    margin-bottom:0;
  }

  .product-description{
    margin-top:20px;
    color:#555;
    font-size:15px;
    line-height:1.72;
  }

  .product-description p{
    margin:0 0 12px;
  }

  .product-description .edition-note{
    color:#777;
    font-size:13px;
  }

  /* ===== LIGHTBOX — OLD SITE GEOMETRY ===== */
  .image-lightbox[hidden]{
    display:none;
  }

  .image-lightbox{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:99999;
    background:rgba(255,255,255,.96);
    overflow:hidden;
  }

  .image-lightbox-content{
    position:absolute;
    top:40px;
    right:60px;
    bottom:40px;
    left:60px;
    padding:0;
    overflow:auto;
    background:transparent;
    box-sizing:border-box;
  }

  .image-lightbox-content img{
    width:100%;
    max-width:none;
    max-height:none;
    height:auto;
    object-fit:contain;
    display:block;
  }

  .image-lightbox-placeholder{
    width:100%;
    aspect-ratio:1/1;
    background:#e8e8e6;
  }

  .image-lightbox-close{
    position:fixed;
    top:36px;
    right:16px;
    z-index:100000;
    width:38px;
    height:38px;
    border:0;
    background:transparent;
    color:#222;
    font:inherit;
    font-size:32px;
    font-weight:300;
    line-height:1;
    cursor:pointer;
  }

  @media(max-width:1050px){
    .product-layout{
      width:min(760px,100%);
      min-height:auto;
      padding:22px 0 36px;
      grid-template-columns:1fr;
      gap:34px;
    }

    .product-image-slot{
      width:min(600px,80vw);
      justify-self:center;
    }

    .product-copy{
      max-width:600px;
      margin:0 auto;
    }
  }

  @media(max-width:960px){
    #art-prints-page{padding:24px 22px 48px}

    .print-grid{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:30px;
    }
  }

  @media(max-width:620px){
    #art-prints-page{padding:20px 18px 42px}

    .print-grid{
      grid-template-columns:1fr;
      gap:34px;
    }

    .product-image-slot{
      width:100%;
    }

    .image-lightbox-content{
      top:24px;
      right:16px;
      bottom:24px;
      left:16px;
    }

    .image-lightbox-close{
      top:20px;
      right:2px;
    }
  }
</style>

<div id="art-prints-page">

  <section id="print-grid" class="print-grid" aria-label="Art prints"></section>

  <section id="product-view" class="product-view" hidden>
    <div class="product-layout">

      <div id="product-image-slot"
           class="product-image-slot"
           role="button"
           tabindex="0"
           aria-label="Open full-screen image"></div>

      <div class="product-copy">
        <div id="paypal-product" class="paypal-product"></div>
        <div id="product-description" class="product-description"></div>
        <div id="product-facts" class="product-facts"></div>
      </div>

    </div>
  </section>

  <div id="image-lightbox" class="image-lightbox" hidden>
    <button id="image-lightbox-close"
            class="image-lightbox-close"
            type="button"
            aria-label="Close image">×</button>
    <div id="image-lightbox-content" class="image-lightbox-content"></div>
  </div>

</div>

<script>
  /* RELEASE 01
     Add the final product JPGs later by filling in each image value.
     Suggested filenames are included for consistency and future SEO work.
  */
  const prints = [
    {
      id: "peach-study",
      title: "Peach Study",
      price: "£35",
      analyticsPrice: 35,
      paypalId: "P45QLYZ5QEDX2",
      image: "",
      suggestedImage: "peach-study-watercolour-fine-art-print.jpg",
      alt: "Watercolour painting of a ripe red peach with green leaves on white paper",
      description: "A watercolour study of a peach and its surrounding leaves, painted after a historical pomological illustration. Transparent washes, softened edges and shifts in colour move the image away from botanical documentation towards a quieter study of form, weight and ripeness.",
      note: "Fine art giclée print from the original FZ Studio watercolour."
    },
    {
      id: "toucan-in-bloom",
      title: "Toucan in Bloom",
      price: "£35",
      analyticsPrice: 35,
      paypalId: "JAJZCTY8T83RW",
      image: "",
      suggestedImage: "toucan-in-bloom-watercolour-fine-art-print.jpg",
      alt: "Colourful watercolour painting of a toucan surrounded by flower petals and green leaves",
      description: "An original watercolour bringing together a brightly coloured toucan, leaves and a deep blue flower. The image grew from an interest in how natural forms can overlap, conceal and reveal one another through colour.",
      note: "Fine art giclée print from an original FZ Studio watercolour."
    },
    {
      id: "violet-bloom",
      title: "Violet Bloom",
      price: "£35",
      analyticsPrice: 35,
      paypalId: "27M72DF3AC6DN",
      image: "",
      suggestedImage: "violet-bloom-botanical-watercolour-fine-art-print.jpg",
      alt: "Loose botanical watercolour painting in violet, pink and blue-green washes",
      description: "An original watercolour developed from observing the movement and structure of a flower. Soft violet, pink and blue-green washes allow the botanical form to move between recognition and abstraction.",
      note: "Fine art giclée print from an original FZ Studio watercolour."
    }
  ];

  const printFacts = [
    "10 × 12 in / 25 × 30 cm",
    "315gsm Cold Press Watercolour Paper",
    "Fine art giclée print",
    "Unframed",
    "Printed to order",
    "Open edition",
    "UK delivery included"
  ];

  const grid = document.getElementById("print-grid");
  const productView = document.getElementById("product-view");
  const productImageSlot = document.getElementById("product-image-slot");
  const paypalProduct = document.getElementById("paypal-product");
  const productFacts = document.getElementById("product-facts");
  const productDescription = document.getElementById("product-description");

  const lightbox = document.getElementById("image-lightbox");
  const lightboxContent = document.getElementById("image-lightbox-content");
  const lightboxClose = document.getElementById("image-lightbox-close");

  function analyticsItem(item){
    return {
      item_id: item.id,
      item_name: item.title,
      item_brand: "FZ Studio",
      item_category: "Art Prints",
      item_variant: "10 × 12 in / 25 × 30 cm",
      price: item.analyticsPrice
    };
  }

  function trackViewItem(item){
    if(typeof gtag !== "function") return;

    gtag("event", "view_item", {
      currency: "GBP",
      value: item.analyticsPrice,
      items: [analyticsItem(item)]
    });
  }

  function trackAddToCart(item){
    if(typeof gtag !== "function") return;

    gtag("event", "add_to_cart", {
      currency: "GBP",
      value: item.analyticsPrice,
      items: [analyticsItem(item)]
    });
  }

  function imageMarkup(item){
    return item.image
      ? `<img src="${item.image}" alt="${item.alt}">`
      : "";
  }

  function renderGrid(){
    grid.innerHTML = prints.map(item => `
      <figure class="print-card" data-product="${item.id}" tabindex="0">
        <div class="print-thumb">${imageMarkup(item)}</div>
        <figcaption class="print-info">
          <p class="print-title">${item.title}</p>
          <p class="print-price">${item.price}</p>
        </figcaption>
      </figure>
    `).join("");
  }

  function openProduct(id, updateHash = true){
    const item = prints.find(print => print.id === id);
    if(!item) return;

    productImageSlot.innerHTML = imageMarkup(item);

    const addToCartElementId = `paypal-add-to-cart-${item.id}`;

    paypalProduct.innerHTML = `
      <paypal-add-to-cart-button
        id="${addToCartElementId}"
        data-id="${item.paypalId}">
      </paypal-add-to-cart-button>
    `;
    cartPaypal.AddToCart({ id: item.paypalId });

    const addToCartButton = document.getElementById(addToCartElementId);
    if(addToCartButton){
      addToCartButton.addEventListener("click", () => {
        trackAddToCart(item);
      });
    }

    productFacts.innerHTML = printFacts
      .map(fact => `<p>${fact}</p>`)
      .join("");

    productDescription.innerHTML = `
      <p>${item.description}</p>
      <p class="edition-note">${item.note}</p>
    `;

    grid.hidden = true;
    productView.hidden = false;
    window.scrollTo(0, 0);

    trackViewItem(item);

    if(updateHash){
      history.pushState({product:id}, "", `#${id}`);
    }
  }

  function showGrid(updateHash = true){
    productView.hidden = true;
    grid.hidden = false;
    closeLargeImage();

    if(updateHash){
      history.pushState({}, "", window.location.pathname);
    }
  }

  /* IMPORTANT:
     Lightbox reads the image that is ACTUALLY displayed in the left square.
     It no longer depends on a separate JS image value.
     So if you later replace the left square with your JPG, clicking it works.
  */
  function openLargeImage(){
    const displayedImage = productImageSlot.querySelector("img");

    lightboxContent.innerHTML = "";

    if(displayedImage){
      const largeImage = document.createElement("img");
      largeImage.src = displayedImage.currentSrc || displayedImage.src;
      largeImage.alt = displayedImage.alt || "";
      lightboxContent.appendChild(largeImage);
    }else{
      const placeholder = document.createElement("div");
      placeholder.className = "image-lightbox-placeholder";
      lightboxContent.appendChild(placeholder);
    }

    lightbox.hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeLargeImage(){
    lightbox.hidden = true;
    lightboxContent.innerHTML = "";
    document.body.style.overflow = "";
  }

  grid.addEventListener("click", event => {
    const card = event.target.closest(".print-card");
    if(card) openProduct(card.dataset.product);
  });

  grid.addEventListener("keydown", event => {
    if(event.key !== "Enter" && event.key !== " ") return;

    const card = event.target.closest(".print-card");
    if(card){
      event.preventDefault();
      openProduct(card.dataset.product);
    }
  });

  productImageSlot.addEventListener("click", openLargeImage);

  productImageSlot.addEventListener("keydown", event => {
    if(event.key === "Enter" || event.key === " "){
      event.preventDefault();
      openLargeImage();
    }
  });

  lightboxClose.addEventListener("click", event => {
    event.stopPropagation();
    closeLargeImage();
  });

  lightbox.addEventListener("click", closeLargeImage);

  document.addEventListener("keydown", event => {
    if(event.key === "Escape" && !lightbox.hidden){
      closeLargeImage();
    }
  });

  window.addEventListener("popstate", () => {
    const id = window.location.hash.slice(1);

    if(prints.some(item => item.id === id)){
      openProduct(id, false);
    }else{
      showGrid(false);
    }
  });

  renderGrid();

  const initialId = window.location.hash.slice(1);
  if(prints.some(item => item.id === initialId)){
    openProduct(initialId, false);
  }
</script>
